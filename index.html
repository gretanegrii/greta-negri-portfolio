<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./src/css/index.css" />
    <title>Greta Negri — in costruzione</title>

    <style>
      body {
        background-color: var(--color-pink-medium);
        color: var(--color-pink);
        font-weight: 500;
      }

      div {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      h1 {
        font-size: 8rem;
        letter-spacing: -0.015em;
        line-height: 1.1;
      }

      .contatti a {
        color: var(--color-text);

        transition: color 0.2s ease;
      }

      .contatti a:hover {
        color: var(--color-pink);
      }

      .contatti [aria-current="page"] {
        opacity: 0.5; /* la pagina corrente, smorzata */
      }

      @media (max-width: 600px) {
        h1 {
          font-size: 2rem;
        }
      }
    </style>
  </head>

  <body>
    <div>
      <h1>Greta Negri — in costruzione &lt;3 &lt;3</h1>
      <p class="contatti">
        <a href="mailto:gretanegri.dev@gmail.com">email</a>
        <a
          href="https://linkedin.com/in/gretanegri"
          target="_blank"
          rel="noopener"
          >linkedin</a
        >
      </p>
    </div>
  </body>
</html>
