<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./src/css/index.css" />
    <title>Greta Negri — in costruzione</title>

    <style>
      html {
        margin: 0;
      }

      body {
        margin: 0;
        background-color: var(--color-pink-medium);
        color: var(--color-pink);
        font-weight: 500;
      }

      div {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3rem;
        min-height: 100vh;
        text-align: center;
      }

      .contatti {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1 {
        font-size: 3rem;
        letter-spacing: -0.015em;
        line-height: 1.1;
      }

      img {
        width: 10%;
      }
      .contatti a {
        color: var(--color-pink);
        transition: text-shadow 0.2s ease;
      }

      .contatti a:hover {
        text-shadow: 0 0 16px rgba(255, 255, 255, 0.8);
      }

      @media (max-width: 600px) {
        h1 {
          font-size: 2rem;
        }

        img {
          width: 30%;
        }
      }
    </style>
  </head>

  <body>
    <div>
      <h1>
        Greta Negri <br />
        in costruzione &lt;3 &lt;3
      </h1>
      <img src="./assets/img/index-photo.png" alt="" />
      <p class="contatti">
        <a href="mailto:gretanegri.dev@gmail.com">email</a>
        <a
          href="https://linkedin.com/in/gretanegri"
          target="_blank"
          rel="noopener"
          >linkedin</a
        >
      </p>
    </div>
  </body>
</html>
